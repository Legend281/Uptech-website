name: Deploy boss-preview to GitHub Pages
# TEMPORARY. This is a static-export preview for internal sign-off only —
# real hosting is Hostinger (Node.js), per CLAUDE.md Section 2. This
# workflow's whole job is producing that preview link; delete this file (and
# turn Pages back off in Settings) once the real hosting is live.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a push mid-deploy queues instead of
# cancelling, so the live preview link never points at a half-finished build.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # app/api/* are real backend routes (POST/PATCH/DELETE, Supabase writes,
      # signed uploads) — `output: "export"` has no server to run them on, and
      # Next.js refuses to build a static export with a non-GET Route Handler
      # present at all.
      #
      # app/admin/* is excluded for a different, more important reason:
      # middleware.ts is the ONLY thing gating those routes behind login
      # (CurrentUserProvider has no client-side redirect of its own — a
      # deliberate choice documented in middleware.ts's own comment, since
      # THAT'S what middleware was built to fix). Middleware requires a
      # server to run, which a static export served from GitHub Pages does
      # not have, so it would silently never run there — every admin page
      # would ship publicly reachable with no login gate at all on a public
      # URL, right as this link is about to be shown outside the team.
      # Supabase RLS would likely still block real data from loading for an
      # unauthenticated visitor, but shipping the page shells un-gated at
      # all isn't worth the risk for a link going to someone outside the
      # team, especially with how sensitive the Onboarding data is.
      #
      # Both removals happen on THIS RUNNER'S CHECKOUT ONLY, right before the
      # static build — the committed source in the repo is untouched, and the
      # real Hostinger build never sets STATIC_EXPORT so never takes this path.
      - name: Remove server-only and auth-gated routes (unsupported by static export)
        run: rm -rf app/api app/admin

      - name: Build static export
        env:
          NODE_ENV: production
          # These two env vars are the only thing that switches next.config.mjs
          # into static-export mode — see the isStaticExport block there. Unset
          # anywhere else (local dev, a future Hostinger build), so this can't
          # leak into the real deployment.
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # /careers (and any other page reading Supabase at build time, e.g.
          # for real job postings) needs these to prerender at all — output:
          # export has no server, so every page must fully resolve during
          # this build, not per-request. The ANON key only, never the
          # service-role key: it's already shipped client-side in the real
          # site's own bundle (NEXT_PUBLIC_SUPABASE_ANON_KEY) and RLS, not
          # this key's secrecy, is what actually protects the data.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
