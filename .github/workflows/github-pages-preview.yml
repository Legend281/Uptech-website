name: Deploy boss-preview to GitHub Pages
# TEMPORARY. This is a static-export preview for internal sign-off only —
# real hosting is Hostinger (Node.js), per CLAUDE.md Section 2. This
# workflow's whole job is producing that preview link; delete this file (and
# turn Pages back off in Settings) once the real hosting is live.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a push mid-deploy queues instead of
# cancelling, so the live preview link never points at a half-finished build.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          NODE_ENV: production
          # These two env vars are the only thing that switches next.config.mjs
          # into static-export mode — see the isStaticExport block there. Unset
          # anywhere else (local dev, a future Hostinger build), so this can't
          # leak into the real deployment.
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
